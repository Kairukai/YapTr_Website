<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YapTr OG card source</title>
<!--
  Source for assets/og-image.png (the 1200x630 social preview card).
  This file is never linked from the site — it exists only to be rendered.

  Regenerate from the repo root:

    & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" `
        --headless --disable-gpu --hide-scrollbars --window-size=1200,630 `
        --screenshot="assets\og-image.png" `
        "file:///c:/Github/Repositories/YapTr_Website/tools/og-card.html"

  Keep it exactly 1200x630 — that's the aspect ratio Discord, Slack, X and
  iMessage crop to. Anything else gets letterboxed or cut.
-->
<style>
  @font-face {
    font-family: 'Fredoka';
    font-weight: 300 700;
    src: url('../assets/fonts/fredoka-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-weight: 100 900;
    src: url('../assets/fonts/inter-latin.woff2') format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #16110e;
    font-family: Inter, sans-serif;
    display: flex; align-items: center; gap: 56px;
    padding: 0 76px;
    position: relative;
  }

  body::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(560px 420px at 22% 18%, rgba(201,138,75,.30), transparent 68%),
      radial-gradient(520px 400px at 84% 76%, rgba(229,9,20,.20), transparent 66%);
  }

  .art { position: relative; flex: 0 0 auto; }
  .art img {
    width: 300px; height: 300px;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,.55));
  }

  .copy { position: relative; }

  h1 {
    font-family: Fredoka, sans-serif;
    font-weight: 700;
    font-size: 76px;
    line-height: 1.03;
    letter-spacing: -0.015em;
    color: #f6efe6;
    margin-bottom: 26px;
  }
  h1 span {
    background: linear-gradient(100deg, #c98a4b, #f0deba);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  p {
    font-size: 27px; line-height: 1.45; color: #b3a294;
    max-width: 620px; margin-bottom: 30px;
  }

  .pills { display: flex; gap: 11px; }
  .pills span {
    border: 1px solid #372a22; background: rgba(255,255,255,.03);
    border-radius: 100px; padding: 9px 20px;
    font-size: 19px; font-weight: 500; color: #f0deba;
  }
</style>
</head>
<body>
  <div class="art"><img src="../assets/yappy-256.png" alt=""></div>
  <div class="copy">
    <h1>Japanese in.<br><span>English on screen.</span></h1>
    <p>Live Japanese&nbsp;→&nbsp;English subtitles for anything playing on your PC. Runs entirely on your own machine.</p>
    <div class="pills">
      <span>Fully local</span>
      <span>No telemetry</span>
      <span>Free</span>
    </div>
  </div>
</body>
</html>
