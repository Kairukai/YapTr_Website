name: Suggestions, questions and concerns
description: Share an idea, ask a question or raise a concern about YapTr.
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Feedback is welcome, whether it is a feature idea, a question, or something that concerns you.
        This report will be public. For a conversation, you can also join https://discord.gg/KszM2kaWTn.
  - type: dropdown
    id: kind
    attributes:
      label: What would you like to share?
      options:
        - Suggestion or feature idea
        - Question
        - Concern
        - Other feedback
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Tell us about it
      description: Explain your idea, question or concern. Examples are welcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: More context
      description: If relevant, describe how this affects you, what you have tried, or what you would like to happen.
    validations:
      required: false
